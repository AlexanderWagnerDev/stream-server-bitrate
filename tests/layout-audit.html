<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Overlay layout audit</title></head>
<body>
<output id="audit-result" aria-live="off">RUNNING</output>
<script type="module">
"use strict";
const presets = ["classic", "minimal", "pill", "card", "glass", "neon",
  "broadcast", "terminal", "outline", "scoreboard", "gradient", "ticker"];
const cases = [
  ...presets.map(preset => ({ preset, layout: "vertical", width: 320 })),
  ...["vertical", "horizontal", "compact", "grid", "split", "dashboard"]
    .map(layout => ({ preset: "glass", layout, width: 280 })),
];
const longText = "custom-long-label-without-any-spaces-abcdef1234567890";
const labels = {
  bitrate: longText, rtt: "Latency", throughput: "Raw network throughput",
  peers: "SRTLA connections", link: "Transport link", jitter: longText,
  uptime: "Streaming uptime", status: "Signal health",
  live: "CONNECTED", offline: "DISCONNECTED",
  bitrate_graph: "Bitrate for the recent connection",
  rtt_graph: "Round-trip history graph",
  bitrate_bar: "Connection bitrate",
  links_singular: "uplink", links_plural: "uplinks",
  kbps: "kb/s", mbps: "Mb/s", ms: "ms",
};
const settings = (preset, layout) => ({
  design: {
    preset, layout, align: "left", font_size: 23,
    show_bitrate_label: true, font_weight: 700,
    padding: "8px 10px", row_padding: "6px 12px",
    background: "rgba(12, 18, 30, 0.85)",
  },
  display: {
    labels, bitrate: true, rtt: true, throughput: true, peers: true,
    uptime: true, status: true, graph: true, rtt_graph: true,
    bitrate_bar: true, history_points: 20,
    graph_width: 300, graph_height: 90,
    title: "A long overlay title that needs to wrap to fit",
  },
});
async function runAudit() {
  const failures = [];
  const frames = await Promise.all(cases.map(item => new Promise(resolve => {
    const frame = document.createElement("iframe");
    frame.width = item.width;
    frame.height = 1200;
    frame.style.cssText = "position:absolute;left:-10000px;top:0;visibility:hidden";
    frame.src = "../bitrate.html?demo=1&srtla=1";
    frame.addEventListener("load", () => resolve({ frame, item }), { once: true });
    document.body.appendChild(frame);
  })));
  for (const { frame, item } of frames) {
    frame.contentWindow.postMessage({
      type: "bitrate-overlay-preview",
      settings: settings(item.preset, item.layout),
    }, location.origin);
  }
  await new Promise(resolve => setTimeout(resolve, 700));
  for (const { frame, item } of frames) {
    const doc = frame.contentDocument;
    const overlay = doc.getElementById("overlay");
    const root = overlay.getBoundingClientRect();
    const children = overlay.querySelectorAll(
      ".row, .chart, .bar-widget, .label, .value, .chart-label, .overlay-title"
    );
    const checked = [...children];
    if (!checked.length) failures.push(item.preset + "/" + item.layout + ": no widgets");
    for (const element of checked) {
      const rect = element.getBoundingClientRect();
      const limit = Math.min(root.right + 2, doc.documentElement.clientWidth + 2);
      if (rect.right > limit || rect.left < root.left - 2) {
        failures.push(item.preset + "/" + item.layout + ": overflow " +
          element.className + " at " + rect.right.toFixed(1) + " > " + limit.toFixed(1));
      }
    }
    frame.remove();
  }
  const output = document.getElementById("audit-result");
  output.textContent = failures.length ? "FAIL " + failures.join("; ") : "PASS: 18 layout checks";
}
try {
  await runAudit();
} catch (error) {
  document.getElementById("audit-result").textContent = "FAIL " + error;
}
</script>
</body>
</html>
